# ============ JPA 配置 ============
# 表结构由 classpath:db/schema.sql 创建（与 MyBatis 版同一份），故 ddl-auto=none 只做映射
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

server.port=8080

# ============ 数据源（H2 文件库） ============
spring.datasource.url = jdbc:h2:~/backend-vs-jpa
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = 123456

# 建表 + 种子数据（复用与 MyBatis 版一致的 db/schema.sql、db/data.sql）
spring.sql.init.username = sa
spring.sql.init.password = 123456
spring.sql.init.schema-locations = classpath:db/schema.sql
spring.sql.init.data-locations = classpath:db/data.sql
spring.sql.init.mode=always

spring.h2.console.enabled = true
spring.h2.console.path=/h2-console

logging.pattern.console=%d{HH:mm:ss} %-4level - %msg%n
