bean-searcher.exporter.batch-delay = 500ms

spring.datasource.url = jdbc:h2:~/backend-springboot2
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = 123456

spring.sql.init.username = sa
spring.sql.init.password = 123456
spring.sql.init.schema-locations = classpath:db/schema.sql
spring.sql.init.data-locations = classpath:db/data.sql
spring.sql.init.mode = always

spring.h2.console.enabled = true
spring.h2.console.path = /h2-console

logging.pattern.console = %d{HH:mm:ss} %-4level - %msg%n

logging.level.root: INFO
logging.level.cn.zhxu.bs: DEBUG
